/* ===== GENEL ===== */
body{
margin:0;
background:
linear-gradient(to bottom,rgba(5,10,20,0.25),rgba(0,15,25,0.45)),
linear-gradient(to bottom,#071522 0%,#10283a 45%,#06344a 55%,#021923 100%);
color:white;
font-family:'Orbitron',sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

/* ===== OKYANUS ===== */
body::before{
content:"";
position:absolute;
left:-10%;
bottom:-8%;
width:120%;
height:53%;
background:
radial-gradient(ellipse at 50% 0%,rgba(90,220,255,0.32) 0%,transparent 42%),
linear-gradient(to bottom,#07516c 0%,#063c54 28%,#021d2b 100%);
border-radius:50% 50% 0 0;
box-shadow:
0 -15px 35px rgba(40,190,240,0.25),
inset 0 20px 30px rgba(130,235,255,0.18);
animation:oceanMove 7s ease-in-out infinite;
z-index:0;
}

/* ===== BELİRGİN DALGALAR ===== */
body::after{
content:"";
position:absolute;
left:-20%;
bottom:17%;
width:140%;
height:30%;
background:
repeating-radial-gradient(
ellipse at 50% 100%,
transparent 0px,
transparent 20px,
rgba(150,240,255,0.42) 22px,
rgba(150,240,255,0.18) 27px,
transparent 34px
);
opacity:0.75;
filter:blur(1px);
animation:waves 5s linear infinite;
z-index:1;
}

/* ===== ŞİMŞEK ===== */
.container::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(
120deg,
transparent 46%,
rgba(255,255,255,0.95) 47%,
rgba(190,225,255,0.8) 48%,
transparent 49%
),
linear-gradient(
72deg,
transparent 57%,
rgba(255,255,255,0.9) 58%,
rgba(170,220,255,0.75) 59%,
transparent 60%
);
background-size:100% 100%,100% 100%;
opacity:0;
pointer-events:none;
z-index:2;
animation:lightning 9s infinite;
}

/* ===== ŞİMŞEK PARLAMASI ===== */
.container::after{
content:"";
position:fixed;
inset:0;
background:rgba(220,245,255,0.18);
opacity:0;
pointer-events:none;
z-index:3;
animation:skyFlash 9s infinite;
}

/* ===== ANA KUTU ===== */
.container{
text-align:center;
width:90%;
max-width:420px;
animation:fadeIn 1s ease-in-out;
position:relative;
z-index:10;
}

/* ===== BAŞLIK ===== */
h1{
font-size:48px;
font-weight:900;
letter-spacing:4px;
margin-bottom:15px;
color:white;
text-shadow:
0 0 10px #ffffff,
0 0 20px #5865F2,
0 0 40px #5865F2;
}

/* ===== ALT YAZI ===== */
p{
font-size:18px;
opacity:0.75;
margin-bottom:35px;
}

/* ===== BUTON GENEL ===== */
.button{
display:block;
width:100%;
padding:18px;
margin:18px 0;
font-size:20px;
font-weight:700;
border:none;
border-radius:14px;
cursor:pointer;
transition:all 0.3s ease;
text-decoration:none;
color:white;
}

/* ===== DISCORD ===== */
.discord{
background:#5865F2;
box-shadow:0 0 15px #5865F2;
}
.discord:hover{
box-shadow:0 0 30px #5865F2,0 0 60px #5865F2;
transform:translateY(-4px) scale(1.03);
}

/* ===== TELEGRAM ===== */
.telegram{
background:#229ED9;
box-shadow:0 0 15px #229ED9;
}
.telegram:hover{
box-shadow:0 0 30px #229ED9,0 0 60px #229ED9;
transform:translateY(-4px) scale(1.03);
}

/* ===== MEGALL ===== */
.megall{
background:#ff0066;
box-shadow:0 0 15px #ff0066;
}
.megall:hover{
box-shadow:0 0 30px #ff0066,0 0 60px #ff0066;
transform:translateY(-4px) scale(1.03);
}

/* ===== OKYANUS HAREKETİ ===== */
@keyframes oceanMove{
0%,100%{
transform:translateX(0) scaleY(1);
}
50%{
transform:translateX(-2%) scaleY(1.04);
}
}

/* ===== DALGA HAREKETİ ===== */
@keyframes waves{
0%{
transform:translateX(0) translateY(0);
}
50%{
transform:translateX(-4%) translateY(-10px);
}
100%{
transform:translateX(0) translateY(0);
}
}

/* ===== GERÇEKÇİ ŞİMŞEK ÇAKMASI ===== */
@keyframes lightning{
0%,86%,100%{
opacity:0;
}
87%{
opacity:0.05;
}
87.5%{
opacity:0.95;
}
88%{
opacity:0.08;
}
88.4%{
opacity:0.75;
}
89%{
opacity:0;
}
}

/* ===== GÖKYÜZÜ PARLAMASI ===== */
@keyframes skyFlash{
0%,86%,100%{
opacity:0;
}
87.3%{
opacity:0.05;
}
87.5%{
opacity:0.65;
}
88%{
opacity:0.08;
}
88.5%{
opacity:0.42;
}
89%{
opacity:0;
}
}

/* ===== ANİMASYON ===== */
@keyframes fadeIn{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

</style>

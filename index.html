<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOP HAVEN</title>
<link rel="icon" type="image/png" href="logo.jpg">

<!-- Google Fonts: Orbitron & Rajdhani -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
}

body{
background:
radial-gradient(circle at 20% 20%,rgba(255,0,170,.18),transparent 30%),
radial-gradient(circle at 80% 75%,rgba(147,0,255,.15),transparent 32%),
linear-gradient(135deg,#05020a,#090611 45%,#02070d);

color:#fff;
font-family:'Orbitron', sans-serif;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;
overflow:hidden;

position:relative;
}


/* =========================================================
   ANIMATED LIGHT ORBS
========================================================= */

body::before{
content:"";
position:fixed;

width:650px;
height:650px;

left:-280px;
top:-260px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(255,0,212,.3) 0%,
rgba(180,0,255,.12) 35%,
transparent 70%
);

filter:blur(20px);

animation:
orbOne 12s ease-in-out infinite alternate;

pointer-events:none;
}


body::after{
content:"";
position:fixed;

width:700px;
height:700px;

right:-300px;
bottom:-300px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(150,0,255,.28) 0%,
rgba(255,0,180,.1) 38%,
transparent 70%
);

filter:blur(25px);

animation:
orbTwo 15s ease-in-out infinite alternate;

pointer-events:none;
}


/* =========================================================
   MOVING LIGHT STREAKS
========================================================= */

.light{
position:fixed;
width:600px;
height:2px;

background:linear-gradient(
90deg,
transparent,
rgba(255,0,200,.7),
transparent
);

filter:blur(2px);

opacity:.35;

pointer-events:none;

transform:rotate(-28deg);

animation:lightMove 9s linear infinite;
}

.light.one{
top:18%;
left:-650px;
}

.light.two{
top:65%;
left:-750px;
animation-delay:4s;
background:linear-gradient(
90deg,
transparent,
rgba(180,0,255,.7),
transparent
);
}


/* =========================================================
   MAIN GLASS PANEL
========================================================= */

.container{
position:relative;
z-index:10;

width:90%;
max-width:520px;

padding:48px 42px 42px;

text-align:center;

background:
linear-gradient(
145deg,
rgba(255,255,255,.075),
rgba(255,255,255,.025)
);

border:1px solid rgba(255,0,200,.25);

border-radius:28px;

backdrop-filter:blur(24px);
-webkit-backdrop-filter:blur(24px);

box-shadow:
0 30px 100px rgba(0,0,0,.65),
inset 0 1px rgba(255,255,255,.12),
0 0 80px rgba(215,0,255,.15);

animation:panelAppear 1s cubic-bezier(.16,1,.3,1);
}


/* =========================================================
   PANEL NEON BORDER
========================================================= */

.container::before{
content:"";

position:absolute;
inset:-1px;

border-radius:28px;

background:
linear-gradient(
135deg,
rgba(255,0,190,.65),
transparent 30%,
transparent 65%,
rgba(170,0,255,.6)
);

opacity:.55;

z-index:-1;

filter:blur(1px);
}


/* =========================================================
   TITLE (BÜYÜTÜLDÜ & MOR-PEMBE GLOW EKLENDİ)
========================================================= */

h1{
margin:0 0 12px;

font-size:68px; /* Büyütüldü */
font-weight:900;

letter-spacing:6px;

color:#fff;

position:relative;

text-shadow:
0 0 8px #fff,
0 0 18px #ff00ea,
0 0 35px #d400ff,
0 0 65px #aa00ff,
0 0 100px #8800ff;

animation:
titlePulse 3s ease-in-out infinite alternate;
}


/* =========================================================
   TITLE UNDERLINE
========================================================= */

h1::after{
content:"";

display:block;

width:130px;
height:3px;

margin:20px auto 0;

background:
linear-gradient(
90deg,
transparent,
#ff00ea,
#a600ff,
transparent
);

box-shadow:
0 0 10px #ff00ea,
0 0 22px #a600ff;

animation:linePulse 2.5s ease-in-out infinite alternate;
}


/* =========================================================
   SUBTITLE
========================================================= */

p{
margin:22px 0 38px;

font-size:14px;
font-weight:700;

letter-spacing:6px;

color:#f3d5ff;

text-transform:uppercase;

text-shadow:
0 0 10px rgba(255,0,220,.5);
}


/* =========================================================
   BUTTON
========================================================= */

.button{
display:flex;

align-items:center;
justify-content:center;

width:100%;

min-height:68px;

padding:18px 24px;

margin:15px 0;

font-size:16px;
font-weight:800;

letter-spacing:1px;

border-radius:15px;

cursor:pointer;

text-decoration:none;

color:#fff;

position:relative;

overflow:hidden;

border:1px solid rgba(255,255,255,.2);

transition:
transform .35s cubic-bezier(.16,1,.3,1),
box-shadow .35s ease,
border-color .35s ease;

isolation:isolate;
}


/* =========================================================
   MOVING SHINE
========================================================= */

.button::before{
content:"";

position:absolute;

top:-100%;
left:-60%;

width:45%;
height:300%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.4),
transparent
);

transform:rotate(25deg);

transition:1s;

z-index:-1;
}

.button:hover::before{
left:120%;
}


/* =========================================================
   INNER GLOW
========================================================= */

.button::after{
content:"";

position:absolute;
inset:0;

border-radius:inherit;

background:
linear-gradient(
120deg,
transparent 20%,
rgba(255,255,255,.10),
transparent 80%
);

opacity:.5;

pointer-events:none;
}


/* =========================================================
   DISCORD
========================================================= */

.discord{
background:
linear-gradient(
135deg,
#4123c4,
#6a00ff 45%,
#9b00e8
);

box-shadow:
0 0 15px rgba(155,0,232,.65),
0 0 35px rgba(106,0,255,.3),
inset 0 1px rgba(255,255,255,.3);

animation:discordGlow 4s ease-in-out infinite alternate;
}

.discord:hover{
transform:
translateY(-5px)
scale(1.025);

border-color:#e099ff;

box-shadow:
0 0 20px #a200ff,
0 0 45px #d400ff,
0 0 90px rgba(212,0,255,.75),
inset 0 0 25px rgba(255,255,255,.25);
}


/* =========================================================
   TELEGRAM
========================================================= */

.telegram{
background:
linear-gradient(
135deg,
#0051d0,
#7000d9 45%,
#b700ff
);

box-shadow:
0 0 15px rgba(183,0,255,.6),
0 0 35px rgba(112,0,217,.25),
inset 0 1px rgba(255,255,255,.3);

animation:telegramGlow 4s ease-in-out infinite alternate;
}

.telegram:hover{
transform:
translateY(-5px)
scale(1.025);

border-color:#ee99ff;

box-shadow:
0 0 20px #b700ff,
0 0 45px #8c00ff,
0 0 90px rgba(225,0,255,.7),
inset 0 0 25px rgba(255,255,255,.25);
}


/* =========================================================
   MEGALL
========================================================= */

.megall{
background:
linear-gradient(
135deg,
#a30052,
#ff0066 45%,
#8800ff
);

box-shadow:
0 0 15px rgba(255,0,102,.7),
0 0 35px rgba(136,0,255,.3),
inset 0 1px rgba(255,255,255,.3);

animation:megallGlow 4s ease-in-out infinite alternate;
}

.megall:hover{
transform:
translateY(-5px)
scale(1.025);

border-color:#ff8ac6;

box-shadow:
0 0 20px #ff0077,
0 0 45px #d400ff,
0 0 90px rgba(255,0,150,.8),
inset 0 0 25px rgba(255,255,255,.25);
}


/* =========================================================
   TITLE ANIMATION (MOR - PEMBE GLOW TRANSITION)
========================================================= */

@keyframes titlePulse{

0%{
text-shadow:
0 0 8px #fff,
0 0 18px #ff00ea,
0 0 35px #d400ff,
0 0 65px #aa00ff,
0 0 100px #8800ff;
}

100%{
text-shadow:
0 0 10px #fff,
0 0 22px #ff0088,
0 0 40px #ff00ea,
0 0 75px #be00ff,
0 0 110px #6600ff;
}

}


/* =========================================================
   LINE ANIMATION
========================================================= */

@keyframes linePulse{

0%{
width:90px;
opacity:.6;
}

100%{
width:160px;
opacity:1;
}

}


/* =========================================================
   BUTTON GLOWS (PURPLE / PINK)
========================================================= */

@keyframes discordGlow{

0%{
box-shadow:
0 0 12px rgba(170,0,255,.45),
0 0 30px rgba(255,0,200,.18);
}

100%{
box-shadow:
0 0 25px rgba(212,0,255,.8),
0 0 50px rgba(255,0,212,.4);
}

}

@keyframes telegramGlow{

0%{
box-shadow:
0 0 12px rgba(183,0,255,.4),
0 0 30px rgba(112,0,217,.15);
}

100%{
box-shadow:
0 0 25px rgba(225,0,255,.75),
0 0 50px rgba(140,0,255,.4);
}

}

@keyframes megallGlow{

0%{
box-shadow:
0 0 12px rgba(255,0,102,.45),
0 0 30px rgba(136,0,255,.18);
}

100%{
box-shadow:
0 0 25px rgba(255,0,150,.85),
0 0 50px rgba(212,0,255,.4);
}

}


/* =========================================================
   BACKGROUND ANIMATIONS
========================================================= */

@keyframes orbOne{

0%{
transform:translate(0,0) scale(1);
}

50%{
transform:translate(180px,120px) scale(1.25);
}

100%{
transform:translate(50px,300px) scale(.9);
}

}


@keyframes orbTwo{

0%{
transform:translate(0,0) scale(1);
}

50%{
transform:translate(-160px,-120px) scale(1.2);
}

100%{
transform:translate(-50px,-280px) scale(.9);
}

}


@keyframes lightMove{

0%{
transform:
translateX(0)
rotate(-28deg);
opacity:0;
}

10%{
opacity:.4;
}

50%{
opacity:.5;
}

90%{
opacity:.2;
}

100%{
transform:
translateX(1700px)
rotate(-28deg);
opacity:0;
}

}


/* =========================================================
   PANEL ENTRY
========================================================= */

@keyframes panelAppear{

from{
opacity:0;
transform:
translateY(35px)
scale(.96);
filter:blur(8px);
}

to{
opacity:1;
transform:
translateY(0)
scale(1);
filter:blur(0);
}

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

body{
padding:20px;
}

.container{
padding:38px 22px 32px;
border-radius:22px;
}

h1{
font-size:48px;
letter-spacing:4px;
}

p{
font-size:11px;
letter-spacing:3px;
margin-bottom:30px;
}

.button{
font-size:13px;
min-height:65px;
padding:15px 12px;
}

}


/* =========================================================
   SMALL HEIGHT SCREENS
========================================================= */

@media(max-height:700px){

.container{
padding-top:28px;
padding-bottom:25px;
}

h1{
font-size:50px;
}

p{
margin-bottom:25px;
}

.button{
min-height:58px;
margin:10px 0;
}

}

</style>

/* ===== GENEL ===== */
*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
min-height:100%;
}

body{
background:#eeeae4;
color:#171717;
font-family:'DM Sans',sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:45px 20px;
overflow-x:hidden;
}

/* ===== ARKAPLAN ===== */
body::before{
content:"";
position:fixed;
width:650px;
height:650px;
border-radius:50%;
background:#d8c9b5;
top:-300px;
right:-220px;
opacity:.55;
z-index:0;
}

body::after{
content:"";
position:fixed;
width:500px;
height:500px;
border-radius:50%;
background:#c7d0cc;
bottom:-280px;
left:-200px;
opacity:.5;
z-index:0;
}

/* ===== ANA ALAN ===== */
.container{
position:relative;
z-index:2;
width:100%;
max-width:620px;
background:#f8f6f2;
border:1px solid rgba(0,0,0,.08);
padding:55px 55px 48px;
box-shadow:
0 25px 80px rgba(0,0,0,.12);
}

/* ===== ÜST ÇİZGİ ===== */
.container::before{
content:"";
display:block;
width:42px;
height:4px;
background:#171717;
margin-bottom:32px;
}

/* ===== BAŞLIK ===== */
h1{
font-family:'Playfair Display',serif;
font-size:64px;
font-weight:700;
letter-spacing:-2px;
line-height:.95;
margin:0 0 18px;
color:#171717;
text-shadow:none;
animation:none;
}

/* ===== ALT YAZI ===== */
p{
font-size:13px;
font-weight:600;
letter-spacing:5px;
text-transform:uppercase;
margin:0 0 42px;
color:#77736e;
opacity:1;
}

/* ===== BUTON GENEL ===== */
.button{
display:flex;
align-items:center;
justify-content:space-between;
width:100%;
min-height:72px;
padding:0 22px;
margin:12px 0;
font-size:17px;
font-weight:700;
letter-spacing:.2px;
border:1px solid #dedbd5;
border-radius:4px;
cursor:pointer;
transition:
transform .3s ease,
box-shadow .3s ease,
background .3s ease;
text-decoration:none;
color:#171717;
position:relative;
overflow:hidden;
background:#ffffff;
box-shadow:none;
}

/* ===== NUMARA / OK İŞARETİ ===== */
.button::after{
content:"↗";
font-size:22px;
font-weight:400;
transition:transform .3s ease;
}

.button:hover::after{
transform:translate(4px,-4px);
}

/* ===== HOVER ===== */
.button:hover{
transform:translateX(7px);
box-shadow:0 12px 30px rgba(0,0,0,.09);
}

/* ===== DISCORD ===== */
.discord{
background:#ffffff;
box-shadow:none;
}

.discord:hover{
background:#e9e7ff;
box-shadow:0 12px 30px rgba(88,101,242,.15);
}

/* ===== TELEGRAM ===== */
.telegram{
background:#ffffff;
box-shadow:none;
}

.telegram:hover{
background:#e4f7fc;
box-shadow:0 12px 30px rgba(34,158,217,.15);
}

/* ===== MEGALL ===== */
.megall{
background:#ffffff;
box-shadow:none;
}

.megall:hover{
background:#ffe7f1;
box-shadow:0 12px 30px rgba(255,0,102,.15);
}

/* ===== İÇERİK AYRACI ===== */
.button:first-of-type{
margin-top:0;
}

/* ===== MOBİL ===== */
@media(max-width:600px){

body{
padding:20px 14px;
align-items:center;
}

.container{
padding:40px 24px 32px;
}

h1{
font-size:48px;
letter-spacing:-1px;
}

p{
font-size:11px;
letter-spacing:4px;
margin-bottom:32px;
}

.button{
font-size:15px;
min-height:68px;
padding:0 17px;
}

}

/* ===== GİRİŞ ===== */
@keyframes appear{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.container{
animation:appear .7s ease-out both;
}

</style>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOP HAVEN</title>
<link rel="icon" type="image/png" href="logo.jpg">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* ===== GENEL ===== */
body{
margin:0;
background:
linear-gradient(rgba(5,0,15,0.72),rgba(5,0,15,0.84)),
url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=90");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
font-family:'Rajdhani',sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
position:relative;
}

/* ===== YAĞMUR EFEKTİ ===== */
body::before{
content:"";
position:absolute;
inset:-100%;
pointer-events:none;
z-index:1;

background-image:
repeating-linear-gradient(
105deg,
transparent 0px,
transparent 8px,
rgba(255,255,255,0.10) 9px,
rgba(255,255,255,0.10) 10px,
transparent 11px,
transparent 35px
);

background-size:80px 140px;
animation:rainFall 0.55s linear infinite;
opacity:0.45;
}

/* Daha yoğun ikinci yağmur katmanı */
body::after{
content:"";
position:absolute;
inset:-100%;
pointer-events:none;
z-index:2;

background-image:
repeating-linear-gradient(
105deg,
transparent 0px,
transparent 18px,
rgba(180,140,255,0.13) 19px,
rgba(255,120,220,0.13) 20px,
transparent 21px,
transparent 55px
);

background-size:120px 180px;
animation:rainFall 0.9s linear infinite;
opacity:0.55;
}

@keyframes rainFall{
0%{
transform:translateY(-80px);
}
100%{
transform:translateY(180px);
}
}

/* ===== ANA KUTU ===== */
.container{
text-align:center;
width:90%;
max-width:420px;
animation:fadeIn 1s ease-in-out;
position:relative;
z-index:5;
}

/* ===== BAŞLIK ===== */
h1{
font-size:58px;
font-weight:700;
letter-spacing:8px;
margin-bottom:15px;

background:linear-gradient(
90deg,
#ff4fd8,
#ff00a8,
#c84cff,
#8b2cff,
#ff4fd8
);

background-size:300% 300%;
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 5px rgba(255,255,255,0.9),
0 0 15px rgba(255,0,170,0.8),
0 0 30px rgba(255,0,170,0.7),
0 0 55px rgba(170,40,255,0.8),
0 0 90px rgba(120,0,255,0.5);

animation:
titleFlow 4s ease-in-out infinite,
titleGlow 2.5s ease-in-out infinite alternate;
}

/* ===== ALT YAZI ===== */
p{
font-size:18px;
font-weight:600;
letter-spacing:3px;
opacity:0.85;
margin-bottom:35px;
color:#e8dfff;
}

/* ===== BUTON GENEL ===== */
.button{
display:block;
width:100%;
padding:18px;
margin:18px 0;
font-size:20px;
font-weight:700;
letter-spacing:1px;
border:none;
border-radius:14px;
cursor:pointer;
transition:all 0.3s ease;
text-decoration:none;
color:white;
position:relative;
overflow:hidden;
}

/* ===== FLOW EFEKTİ ===== */
.button::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:80%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,0.35),
transparent
);
transform:skewX(-25deg);
transition:0.7s;
}

.button:hover::before{
left:140%;
}

/* ===== DISCORD ===== */
.discord{
background:linear-gradient(135deg,#7b61ff,#5865f2,#8f7aff);
background-size:200% 200%;
box-shadow:
0 0 15px #5865F2,
0 0 35px rgba(88,101,242,0.35);
animation:gradientFlow 4s ease infinite;
}

.discord:hover{
box-shadow:
0 0 25px #7b61ff,
0 0 50px #5865F2,
0 0 80px rgba(123,97,255,0.5);
transform:translateY(-4px) scale(1.03);
}

/* ===== TELEGRAM ===== */
.telegram{
background:linear-gradient(135deg,#00c6ff,#229ed9,#00e5ff);
background-size:200% 200%;
box-shadow:
0 0 15px #229ED9,
0 0 35px rgba(0,198,255,0.35);
animation:gradientFlow 4s ease infinite;
}

.telegram:hover{
box-shadow:
0 0 25px #00c6ff,
0 0 50px #229ED9,
0 0 80px rgba(0,198,255,0.5);
transform:translateY(-4px) scale(1.03);
}

/* ===== MEGALL ===== */
.megall{
background:linear-gradient(135deg,#ff008c,#ff0066,#b000ff);
background-size:200% 200%;
box-shadow:
0 0 15px #ff0066,
0 0 35px rgba(255,0,102,0.4);
animation:gradientFlow 4s ease infinite;
}

.megall:hover{
box-shadow:
0 0 25px #ff1493,
0 0 50px #ff0066,
0 0 80px rgba(255,0,102,0.55);
transform:translateY(-4px) scale(1.03);
}

/* ===== RENK FLOW ===== */
@keyframes gradientFlow{
0%{
background-position:0% 50%;
}
50%{
background-position:100% 50%;
}
100%{
background-position:0% 50%;
}
}

/* ===== BAŞLIK RENK AKIŞI ===== */
@keyframes titleFlow{
0%{
background-position:0% 50%;
}
50%{
background-position:100% 50%;
}
100%{
background-position:0% 50%;
}
}

/* ===== BAŞLIK GLOW ===== */
@keyframes titleGlow{
0%{
filter:drop-shadow(0 0 8px rgba(255,0,170,0.7));
}
100%{
filter:
drop-shadow(0 0 15px rgba(255,0,170,0.9))
drop-shadow(0 0 35px rgba(150,40,255,0.8));
}
}

/* ===== ANİMASYON ===== */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* ===== MOBİL ===== */
@media(max-width:500px){

h1{
font-size:43px;
letter-spacing:5px;
}

p{
font-size:16px;
}

.button{
font-size:18px;
padding:16px;
}

}

</style>
</head>
